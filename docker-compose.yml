services:
  folderfolio:
    image: folderfolio:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      FolderFolio__PhotoRoot: /photos
      FolderFolio__CacheRoot: /cache
    volumes:
      - ./photos:/photos:ro
      - folderfolio-cache:/cache

volumes:
  folderfolio-cache: {}
